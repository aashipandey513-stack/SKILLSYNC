<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SKILLSYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Simple custom styles */
        body { background-color: #f8fafc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">SKILLSYNC</h1>
            <p class="mt-2 text-sm text-gray-600">Master Your Interview & Competition Skills</p>
        </div>

        <div class="text-center">
            <h2 class="text-2xl font-semibold text-gray-800">Welcome</h2>
            <p class="text-sm text-gray-500">Sign in to your account or create a new one to get started</p>
        </div>

        <form class="space-y-4" action="/login" method="POST">
            <div>
                <label for="email" class="text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" id="email" 
                       class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                       placeholder="you@example.com" required>
            </div>
            <div>
                <label for="password" class="text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" id="password" 
                       class="w-full px-3 py-2 mt-1 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                       placeholder="........" required>
            </div>
            
            <button type="submit" 
                    class="w-full py-2 px-4 text-white font-semibold bg-blue-600 rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Sign In
            </button>
        </form>

        <form action="/signup" method="POST" class="hidden">
            </form>
        <button onclick="document.forms[1].submit();"
                class="w-full py-2 px-4 text-blue-600 font-semibold bg-white border border-blue-600 rounded-md shadow-sm hover:bg-blue-50">
            Sign Up
        </button>

        <form action="/demo" method="GET">
             <button type="submit" 
                    class="w-full py-2 px-4 mt-2 text-gray-700 font-semibold bg-gray-100 border border-gray-300 rounded-md shadow-sm hover:bg-gray-200">
                Try Demo Account
            </button>
        </form>

        <p class="text-xs text-center text-gray-500">
            By continuing, you agree to our 
            <a href="#" class="font-medium text-blue-600 hover:underline">Terms of Service</a> and 
            <a href="#" class="font-medium text-blue-600 hover:underline">Privacy Policy</a>
        </p>
    </div>

</body>
</html>
