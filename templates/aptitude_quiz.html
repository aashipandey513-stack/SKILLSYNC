<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Test - SKILLSYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-xl shadow-2xl overflow-hidden">
        <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
            <div>
                <h2 class="text-xl font-semibold text-gray-800">Aptitude Test</h2>
                <p id="question-counter" class="text-sm text-gray-600">Question 1 of 5</p>
            </div>
            <div id="quiz-timer" class="text-2xl font-bold text-red-600">
                30:00
            </div>
        </div>

        <div class="p-8">
            <div id="quiz-container">
                <p id="question-category" class="text-sm font-medium text-blue-600 mb-2">Loading...</p>
                <p id="question-text" class="text-lg font-semibold text-gray-900 mb-6">
                    Loading questions...
                </p>
                <div id="options-container" class="space-y-3">
                    </div>
            </div>

            <div id="loading-state" class="text-center p-16 hidden">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
                <p class="text-gray-600 mt-4">Submitting your test...</p>
            </div>
            <div id="end-state" class="text-center p-16 hidden">
                <h3 class="text-2xl font-semibold">Test Completed!</h3>
                <p class="text-gray-600 mt-2">Your score: <span id="quiz-score" class="font-bold text-xl">0/5</span></p>
                <a href="/dashboard" class="mt-6 inline-block px-6 py-2 bg-blue-600 text-white rounded-md">Back to Dashboard</a>
            </div>
        </div>

        <div class="p-6 bg-gray-50 border-t flex justify-between items-center">
            <button id="prev-btn" class="px-6 py-2 bg-gray-200 text-gray-700 font-semibold rounded-md hover:bg-gray-300" disabled>
                &lt; Previous
            </button>
            <button id="next-btn" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700">
                Next &gt;
            </button>
            <button id="submit-btn" class="px-6 py-2 bg-green-600 text-white font-semibold rounded-md hover:bg-green-700 hidden">
                Submit Test
            </button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
